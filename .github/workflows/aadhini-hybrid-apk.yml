name: Aadhini Hybrid Android APK

on:
  push:
    branches:
      - prototype/aadhini-android-hybrid-shell
  pull_request:
    branches:
      - prototype/aadhini-android-hybrid-shell
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Aadhini GLB asset
        run: |
          mkdir -p aadhini-android/src/main/assets/models
          curl --fail --location --retry 2 --output aadhini-android/src/main/assets/models/aadhini.glb "${AADHINI_GLB_URL}"
          test "$(stat -c%s aadhini-android/src/main/assets/models/aadhini.glb)" -eq 46388100
        env:
          AADHINI_GLB_URL: "https://ucc2403b8fad6eca761e5901e722.dl.dropboxusercontent.com/cd/0/get/DMpuEvO9mpo8QEMtD9U3eEKTRt1y3g4uhXbrpFJWIDFhZCiiaGkrocJdZyKRV5jhT94ItN-MAx0yh76aQlWHylaO74gvig4ZGz27MtoAUSBt0Bw3JtA30f1KouV-fWetHMJYNPmWWOjUsr4mhSbTBeTypSK8Ni-SSp_o8cCG8Q5tTg/file?c_luid=26330b01"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Build debug APK
        run: ./gradlew :aadhini-android:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aadhini-hybrid-debug-apk
          path: aadhini-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
