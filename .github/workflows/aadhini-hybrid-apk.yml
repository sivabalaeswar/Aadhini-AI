name: Aadhini Hybrid Android APK

on:
  push:
    branches:
      - prototype/aadhini-android-hybrid-shell
  pull_request:
    branches:
      - prototype/aadhini-android-hybrid-shell
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Aadhini GLB asset
        run: |
          mkdir -p aadhini-android/src/main/assets/models
          curl --fail --location --retry 2 --output aadhini-android/src/main/assets/models/aadhini.glb "${AADHINI_GLB_URL}"
          test "$(stat -c%s aadhini-android/src/main/assets/models/aadhini.glb)" -eq 46388100
        env:
          AADHINI_GLB_URL: "https://ucb5d13c32e28940c1720fce6a04.dl.dropboxusercontent.com/cd/0/get/DMr6WZAJgOgwuWr2TIUjEj9DWi8cxFDNjjsVFaGtIT6rG0VtkOKZKhmfTrkrz1L_WXvYkZpZwUI9dbusMfWklBHeKiuQUs0hTV5U1X3cmCYhu1YlQfhuXSAqyncK9lBMrYqaODTTRYzuhpo06oLaAc_ldogLCk_DG3K3CruuD5REMw/file?c_luid=26330b01"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Build debug APK
        run: ./gradlew :aadhini-android:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aadhini-hybrid-debug-apk
          path: aadhini-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
