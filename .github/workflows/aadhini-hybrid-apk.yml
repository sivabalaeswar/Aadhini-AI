name: Aadhini Hybrid Android APK

on:
  push:
    branches:
      - prototype/aadhini-android-hybrid-shell
  pull_request:
    branches:
      - prototype/aadhini-android-hybrid-shell
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Aadhini GLB asset
        run: |
          mkdir -p aadhini-android/src/main/assets/models
          curl --fail --location --retry 2 --output aadhini-android/src/main/assets/models/aadhini.glb "${AADHINI_GLB_URL}"
          test "$(stat -c%s aadhini-android/src/main/assets/models/aadhini.glb)" -eq 46388100
        env:
          AADHINI_GLB_URL: "https://uc168425a1d41fe641b03756480e.dl.dropboxusercontent.com/cd/0/get/DMox1vm3n5erEv6xLSBmsTcvDPJuI3aLGAhUb7WAmBxHbboV4KO9GiDqB8_scyywEq0YvZOhzO11gtTzHKoHAD-vzmI2gZIumQjPG8oyOx36ASfW2Kjl8iH3s10rFTx3xWZ4bPwQ7RSOOkAVe3DqQj68rH9FLvsGPiL5El2WW8gz3w/file?c_luid=26330b01"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Build debug APK
        run: ./gradlew :aadhini-android:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aadhini-hybrid-debug-apk
          path: aadhini-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
