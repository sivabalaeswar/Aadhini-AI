name: Aadhini Hybrid Android APK

on:
  push:
    branches:
      - prototype/aadhini-android-hybrid-shell
  pull_request:
    branches:
      - prototype/aadhini-android-hybrid-shell
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Aadhini GLB asset
        run: |
          mkdir -p aadhini-android/src/main/assets/models
          curl --fail --location --retry 2 --output aadhini-android/src/main/assets/models/aadhini.glb "${AADHINI_GLB_URL}"
          test "$(stat -c%s aadhini-android/src/main/assets/models/aadhini.glb)" -eq 46388100
        env:
          AADHINI_GLB_URL: "https://uc3111d3833e529ac22b674a0672.dl.dropboxusercontent.com/cd/0/get/DMpTL731auvayc1ic_CmhOL3vg3gs3AexZU0vdMVWniBDPUuJT2-6dAd2EywLgb_mHYbQg5H-qUxBHstCJW5vhSHdfOWwGC_QqgX7Z82gQc96GOyv-hutAqKOV07e9BZNRzZaHqxco4aHjwugM-1MycC-DIra5rt_0JzSFFnxXVDjA/file?c_luid=26330b01"

      - name: Repair GLB emissive materials and validate
        run: |
          python3 - <<'PY'
          import json, struct
          p = "aadhini-android/src/main/assets/models/aadhini.glb"
          data = open(p, "rb").read()
          magic, version, total = struct.unpack_from("<4sII", data, 0)
          assert magic == b"glTF" and version == 2 and total == len(data)
          json_len, json_type = struct.unpack_from("<I4s", data, 12)
          assert json_type == b"JSON"
          doc = json.loads(data[20:20+json_len])
          bin_header = 20 + json_len
          bin_len, bin_type = struct.unpack_from("<I4s", data, bin_header)
          assert bin_type == b"BIN\\x00"
          binary = data[bin_header+8:bin_header+8+bin_len]
          assert len(binary) == bin_len
          for material in doc.get("materials", []):
              if "emissiveFactor" in material:
                  material["emissiveFactor"] = [0.0, 0.0, 0.0]
          encoded = json.dumps(doc, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
          encoded += b" " * ((4 - len(encoded) % 4) % 4)
          total = 12 + 8 + len(encoded) + 8 + len(binary)
          repaired = struct.pack("<4sII", b"glTF", 2, total)
          repaired += struct.pack("<I4s", len(encoded), b"JSON") + encoded
          repaired += struct.pack("<I4s", len(binary), b"BIN\\x00") + binary
          open(p, "wb").write(repaired)
          check = json.loads(repaired[20:20+len(encoded)])
          assert all(not any(x > 0 for x in m.get("emissiveFactor", [0,0,0])) for m in check.get("materials", []))
          assert len(check.get("meshes", [])) == 10 and len(check.get("skins", [])) == 1
          assert len(check.get("images", [])) == 50 and len(check.get("textures", [])) == 59
          print("GLB material repair validated; geometry, skin, textures, morph targets and Draco payload preserved.")
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Build debug APK
        run: ./gradlew :aadhini-android:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aadhini-hybrid-debug-apk
          path: aadhini-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
