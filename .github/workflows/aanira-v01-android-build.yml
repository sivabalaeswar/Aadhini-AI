name: AaNira Android Prototype Build

on:
  push:
    branches:
      - prototype/aanira-v01-live-3d-avatar
  pull_request:
    branches:
      - prototype/aanira-v01-live-3d-avatar
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew :aadhini-android:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aanira-v01-debug-apk
          path: aadhini-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
