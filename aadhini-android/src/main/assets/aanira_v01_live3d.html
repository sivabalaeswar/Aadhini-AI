<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AaNira v02 — Immersive Avatar Preview</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#242044 0%,#0b1020 68%,#070a12 100%);font-family:system-ui}
#stage{width:100%;height:100%;display:block}
#tag{position:absolute;left:14px;top:12px;color:#d8c7ff;font-size:10px;letter-spacing:2px;opacity:.8}
#state{position:absolute;right:14px;top:12px;color:#f3d7f0;font-size:10px;letter-spacing:1px}
</style>
</head>
<body>
<div id="tag">AANIRA V02 · AVATAR PREVIEW</div><div id="state">IDLE</div><canvas id="stage"></canvas>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
(() => {
 const canvas=document.getElementById('stage'), stateLabel=document.getElementById('state');
 const scene=new THREE.Scene(); scene.fog=new THREE.Fog(0x0b1020,7,16);
 const camera=new THREE.PerspectiveCamera(36,1,.1,50); camera.position.set(0,.82,6.4); camera.lookAt(0,.12,0);
 const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.25)); renderer.outputColorSpace=THREE.SRGBColorSpace;
 scene.add(new THREE.HemisphereLight(0xc9d9ff,0x3b244c,2.1));
 const key=new THREE.DirectionalLight(0xffe4d4,3.0); key.position.set(-3,5,5); scene.add(key);
 const rim=new THREE.PointLight(0xb58aff,24,12); rim.position.set(3,2, -2); scene.add(rim);
 const mat=(color,rough=.68,metal=0)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
 const skin=mat(0xe9b995,.72), skinLight=mat(0xf2c7a6), hair=mat(0x21131b,.38), hairHi=mat(0x38202b,.4), iris=mat(0x68402e,.35), black=mat(0x160f18,.25), white=mat(0xfff5ec,.3), lip=mat(0x9d465e,.5), blush=new THREE.MeshBasicMaterial({color:0xe97883,transparent:true,opacity:.28}), outfit=mat(0x55427c,.48,.08), gold=mat(0xd6ae73,.3,.65);
 const root=new THREE.Group(); scene.add(root);
 // Aadhini model slot: the procedural character remains a safe fallback until
 // the validated mobile asset is bundled at android_asset/models/aadhini.glb.
 let avatarMixer=null, avatarMode='PROCEDURAL PREVIEW';
 const gltfLoader=new GLTFLoader();
 gltfLoader.load('models/aadhini.glb', (gltf) => {
  const avatar=gltf.scene;
  const bounds=new THREE.Box3().setFromObject(avatar);
  const size=bounds.getSize(new THREE.Vector3());
  const center=bounds.getCenter(new THREE.Vector3());
  if(size.y>0){
   const fitScale=3.25/size.y;
   avatar.scale.setScalar(fitScale);
   avatar.position.set(-center.x*fitScale,-center.y*fitScale,-center.z*fitScale);
  }
  avatar.traverse((node)=>{
   if(node.isMesh){
    node.frustumCulled=true;
    if(node.morphTargetInfluences && node.morphTargetDictionary){
     node.userData.aadhiniMorphTargets={...node.morphTargetDictionary};
    }
   }
  });
  scene.add(avatar);
  root.visible=false;
  avatarMixer=gltf.animations && gltf.animations.length ? new THREE.AnimationMixer(avatar) : null;
  if(avatarMixer && gltf.animations[0]) avatarMixer.clipAction(gltf.animations[0]).play();
  avatarMode='AADHINI MODEL';
  stateLabel.textContent='AADHINI · MODEL LOADED';
 }, undefined, (error) => {
  console.warn('Aadhini GLB unavailable; keeping procedural preview.', error);
  avatarMode='PROCEDURAL PREVIEW';
  stateLabel.textContent='AADHINI MODEL NOT FOUND · PREVIEW MODE';
 });
 function ball(parent,name,pos,scale,material){const m=new THREE.Mesh(new THREE.SphereGeometry(1,32,24),material);m.name=name;m.position.set(...pos);m.scale.set(...scale);parent.add(m);return m;}
 // shoulders / torso
 const torso=ball(root,'torso',[0,-1.18,-.08],[1.05,.88,.52],outfit);
 ball(root,'neck',[0,-.34,0],[.27,.48,.27],skin);
 // hair back and head
 ball(root,'hair-back',[0,.55,-.24],[.93,1.12,.58],hair);
 const head=new THREE.Group(); root.add(head);
 ball(head,'face',[0,.55,.05],[.78,1.0,.62],skin);
 ball(head,'hair-cap',[0,1.16,-.015],[.82,.58,.66],hair);
 // side locks
 ball(head,'left-lock',[-.69,.55,-.03],[.19,.82,.28],hair);
 ball(head,'right-lock',[.69,.55,-.03],[.19,.82,.28],hair);
 // fringe strands
 for(let i=0;i<5;i++){const x=-.48+i*.24;const strand=ball(head,'fringe-'+i,[x,1.04,.48],[.16,.34,.10],i%2?hair:hairHi);strand.rotation.z=(i-2)*-.13;}
 // ears
 ball(head,'earL',[-.78,.48,.02],[.16,.24,.13],skinLight);ball(head,'earR',[.78,.48,.02],[.16,.24,.13],skinLight);
 // eyes, pupils, lids
 const eyes=[];
 for(const s of [-1,1]){
  const x=s*.31;
  ball(head,'eye-white',[x,.62,.585],[.205,.145,.075],white);
  const irisMesh=ball(head,'iris',[x,.62,.65],[.085,.095,.035],iris);
  const pupil=ball(head,'pupil',[x,.62,.678],[.043,.055,.02],black);
  ball(head,'eye-shine',[x-.025,.66,.696],[.022,.024,.01],white);
  const lid=ball(head,'lid',[x,.765,.61],[.215,.008,.078],skin);
  eyes.push({iris:irisMesh,pupil,lid,x});
  const brow=ball(head,'brow',[x,.87,.57],[.22,.035,.035],hair);brow.rotation.z=s*.08;
 }
 // nose, lips, blush
 ball(head,'nose',[0,.39,.66],[.09,.14,.11],skinLight);
 const mouth=ball(head,'mouth',[0,.12,.635],[.19,.035,.035],lip);
 const lowerLip=ball(head,'lower-lip',[0,.085,.64],[.14,.025,.025],lip);
 ball(head,'blushL',[-.48,.28,.55],[.18,.09,.025],blush);ball(head,'blushR',[.48,.28,.55],[.18,.09,.025],blush);
 // earrings
 ball(head,'earringL',[-.79,.24,.10],[.055,.075,.055],gold);ball(head,'earringR',[.79,.24,.10],[.055,.075,.055],gold);
 // subtle collar
 const collar=ball(root,'collar',[0,-.66,.37],[.42,.12,.08],gold);
 let expression='neutral', blinkUntil=0, nextBlink=performance.now()+1800, gazeX=0, gazeY=0, targetGazeX=0,targetGazeY=0;
 window.aaniraSetExpression=function(value){
  expression=String(value||'neutral').toLowerCase();stateLabel.textContent=expression.toUpperCase();
  const romantic=['romantic','shy','intimacy'].includes(expression);
  const happy=['happy','smile','joy'].includes(expression);
  const thinking=['thinking','curious'].includes(expression);
  mouth.scale.y = happy ? 0.085 : romantic ? 0.065 : thinking ? 0.025 : 0.035;
  mouth.scale.x = romantic ? 0.78 : happy ? 1.12 : 1;
  lowerLip.position.y=romantic?.075:.085;
  head.rotation.z=romantic?-.045:happy?.02:0;
  head.rotation.x=thinking?-.06:0;
  blush.material.opacity = romantic ? 0.62 : happy ? 0.35 : 0.22;
  torso.material=outfit;
  if(romantic){outfit.color.setHex(0x8b315d);collar.material=gold;}
  else if(happy){outfit.color.setHex(0x514d91);}
  else{outfit.color.setHex(0x55427c);}
 };
 window.aaniraSetState=function(value){window.aaniraSetExpression(value);};
 window.aaniraWink=function(){eyes[1].lid.scale.y=.14;setTimeout(()=>eyes[1].lid.scale.y=.008,520);};
 window.aaniraKiss=function(){window.aaniraSetExpression('romantic');mouth.scale.set(.12,.11,.04);setTimeout(()=>mouth.scale.set(.19,.065,.035),700);};
 function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
 new ResizeObserver(resize).observe(canvas);resize();
 let frameCount=0,lastFpsTime=performance.now(),fps=0,previousFrame=0,renderPaused=document.hidden;
 document.addEventListener('visibilitychange',()=>{renderPaused=document.hidden;if(!renderPaused)requestAnimationFrame(animate);});
 canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();stateLabel.textContent='RENDERER LOST';});
 canvas.addEventListener('webglcontextrestored',()=>{stateLabel.textContent='RENDERER RESTORED';});
 function animate(t){
  if(renderPaused)return;
  requestAnimationFrame(animate);
  frameCount++;
  if(t-lastFpsTime>=1000){fps=Math.round(frameCount*1000/(t-lastFpsTime));frameCount=0;lastFpsTime=t;stateLabel.textContent=avatarMode+' · '+fps+' FPS';}
  if(avatarMixer){avatarMixer.update(previousFrame ? Math.min((t-previousFrame)/1000,0.05) : 0);} previousFrame=t;
  const sec=t*.001;
  root.position.y=Math.sin(sec*1.25)*.035;
  head.rotation.y=Math.sin(sec*.48)*.07 + gazeX*.08;
  head.rotation.x+= (gazeY*.035-head.rotation.x)*.025;
  gazeX+=(targetGazeX-gazeX)*.025;gazeY+=(targetGazeY-gazeY)*.025;
  if(t>nextBlink){blinkUntil=t+135;nextBlink=t+1900+Math.random()*2600;}
  const closed=t<blinkUntil?1:0;
  eyes.forEach(e=>{e.lid.scale.y=closed?.145:.008;e.iris.position.x=e.x+gazeX*.035;e.pupil.position.x=e.x+gazeX*.035;e.iris.position.y=.62+gazeY*.025;e.pupil.position.y=.62+gazeY*.025;});
  renderer.render(scene,camera);
 }
 animate(0);
 window.aaniraSetExpression('neutral');
})();
</script>
</body></html>
