plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

layout.buildDirectory.set(file("$rootDir/APK-BUILD-FOLDER"))

android {
    namespace 'ai.aadhini.app'
    compileSdk 34

    defaultConfig {
        applicationId "ai.aadhini.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    sourceSets {
        main {
            java.srcDirs = ['.', '../aadhini-core', '../aadhini-platform']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }

    // Intha puthu block thaan version mismatch-a fix pannum
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
    implementation 'androidx.core:core-ktx:1.12.0'
}
