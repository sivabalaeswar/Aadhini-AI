plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'ai.aadhini.app'
    compileSdk 34

    defaultConfig {
        applicationId "ai.aadhini.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    sourceSets {
        main {
            java.srcDirs = ['.', '../aadhini-core', '../aadhini-platform']
            
            // Intha rendu lines thaan loop error-a cut pannum
            java.include '**/*.kt'
            java.exclude 'build/**'
            java.exclude '**/build/**'
            
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
    implementation 'androidx.core:core-ktx:1.12.0'
}
