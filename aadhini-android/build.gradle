plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

// THE ULTIMATE FIX: Output-a project root-kku ('APK-BUILD-FOLDER') thalli vaikkurom. 
// Ithu aadhini-android folder-kulla varaathu, so loop aagathu!
layout.buildDirectory.set(file("$rootDir/APK-BUILD-FOLDER"))

android {
    namespace 'ai.aadhini.app'
    compileSdk 34

    defaultConfig {
        applicationId "ai.aadhini.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    sourceSets {
        main {
            java.srcDirs = ['.', '../aadhini-core', '../aadhini-platform']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
    implementation 'androidx.core:core-ktx:1.12.0'
}
